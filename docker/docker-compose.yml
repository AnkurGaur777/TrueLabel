services:
  db:
    image: mysql:8.0
    container_name: truelabel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - truelabel_db_data:/var/lib/mysql

volumes:
  truelabel_db_data:
